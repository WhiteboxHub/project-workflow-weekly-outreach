version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: email_outreach_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build: .
    container_name: email_outreach_scheduler
    command: python run_scheduler.py
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    # container_name removed — incompatible with deploy.replicas;
    # Docker auto-names each replica (email_outreach_worker_1, _2, etc.)
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  redis_data:
