version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: email_outreach_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build: .
    container_name: email_outreach_scheduler
    command: python run_scheduler.py
    env_file:
      - .env
    environment:
      - DUCKDB_CAMPAIGN_PATH=/data/campaigns.duckdb   # override relative path from .env
      - REDIS_URL=redis://redis:6379/0                 # use Docker service name, not localhost
      - TZ=America/Los_Angeles                         # ensure datetime.now() = Pacific time
    volumes:
      - duckdb_data:/data          # persist DuckDB campaigns.duckdb across restarts
    depends_on:
      redis:
        condition: service_healthy
    restart: always                # auto-restart on crash or Windows reboot

  worker:
    build: .
    # Runs inside Linux containers — no --pool=solo needed here.
    # --pool=solo is only required when running Celery NATIVELY on Windows (outside Docker).
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - DUCKDB_CAMPAIGN_PATH=/data/campaigns.duckdb   # override relative path from .env
      - REDIS_URL=redis://redis:6379/0                 # use Docker service name, not localhost
      - TZ=America/Los_Angeles                         # ensure datetime.now() = Pacific time
    volumes:
      - duckdb_data:/data          # same shared volume as scheduler
    depends_on:
      redis:
        condition: service_healthy
    restart: always                # auto-restart on crash or Windows reboot
    deploy:
      replicas: 2

  daily_report:
    build: .
    container_name: email_outreach_daily_report
    # Daemon that fires the HTML email report every day at 5:00 PM Pacific.
    # No Windows Task Scheduler or cron needed — fully managed by Docker.
    command: python run_report_service.py
    env_file:
      - .env
    environment:
      - DUCKDB_CAMPAIGN_PATH=/data/campaigns.duckdb   # override relative path from .env
      - REDIS_URL=redis://redis:6379/0                 # use Docker service name, not localhost
      - TZ=America/Los_Angeles                         # ensures report fires at 5:00 PM PST/PDT
    volumes:
      - duckdb_data:/data          # read DuckDB for local campaign attempt data
    depends_on:
      redis:
        condition: service_healthy
    restart: always                # auto-restart on crash or Windows reboot

volumes:
  redis_data:
  duckdb_data:                     # named volume — survives container restarts and rebuilds
